<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5EFE4">
<title>祝福记录 · 我们结婚啦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F5EFE4;
    --bg-soft:#EDE3D0;
    --card:#FBF8F2;
    --ink:#3E2F22;
    --ink-soft:#8A7660;
    --gold:#B08A4F;
    --gold-light:#D4B57E;
    --line:#D9C9AE;
    --dark:#4A3626;
    --serif:Georgia,'Times New Roman','Songti SC','STSong','Noto Serif SC','SimSun',serif;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:#D9CDB6;
    font-family:var(--sans);
    color:var(--ink);
    line-height:1.7;
    font-weight:300;
  }
  .page{
    max-width:560px;margin:0 auto;
    background:var(--bg);
    min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.12);
    padding:0 24px 60px;
  }

  /* ===== 头部 ===== */
  .rec-head{padding:48px 0 0;text-align:center}
  .rec-label{font-size:11px;letter-spacing:.45em;color:var(--gold);padding-left:.45em}
  .rec-title{
    font-family:var(--serif);
    font-size:26px;font-weight:500;
    letter-spacing:.08em;margin-top:14px;
  }
  .rec-sub{font-size:11px;letter-spacing:.2em;color:var(--ink-soft);margin-top:10px}
  .divider{
    display:flex;align-items:center;justify-content:center;
    gap:10px;margin:20px auto 0;
  }
  .divider .line{width:36px;height:1px;background:var(--line)}
  .divider .dot{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}

  /* ===== 统计 ===== */
  .stats{
    display:flex;justify-content:center;gap:0;
    margin:26px 0 0;
    background:var(--card);border:1px solid var(--line);
    padding:18px 0;
  }
  .stat{flex:1;text-align:center;position:relative}
  .stat + .stat::before{
    content:'';position:absolute;left:0;top:2px;bottom:2px;
    width:1px;background:var(--line);
  }
  .stat-num{
    font-family:var(--serif);font-size:26px;color:var(--ink);
    line-height:1.1;display:block;
  }
  .stat-label{
    font-size:10px;letter-spacing:.2em;color:var(--ink-soft);
    margin-top:6px;display:block;
  }

  /* ===== 表格 ===== */
  .table-wrap{
    margin-top:26px;
    background:var(--card);
    border:1px solid var(--line);
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  thead th{
    font-family:var(--sans);font-weight:400;
    font-size:10px;letter-spacing:.18em;color:var(--gold);
    text-align:left;padding:13px 10px;
    background:var(--bg-soft);
    border-bottom:1px solid var(--line);
  }
  tbody td{
    font-size:13px;color:var(--ink);
    padding:13px 10px;vertical-align:top;
    border-bottom:1px dashed var(--line);
    word-break:break-word;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr:nth-child(even){background:rgba(237,227,208,.35)}
  .col-idx{width:34px;color:var(--ink-soft);font-size:11px;font-family:var(--serif)}
  .col-name{width:24%}
  .col-phone{width:30%}
  .name-txt{font-family:var(--serif);font-size:14px}
  .time-txt{
    display:block;font-size:10px;color:var(--ink-soft);
    letter-spacing:.02em;margin-top:3px;
  }
  .phone-txt{
    font-family:var(--sans);font-size:12px;letter-spacing:.03em;
    color:var(--gold);text-decoration:none;
    border-bottom:1px solid var(--gold-light);
    padding-bottom:1px;
  }
  .phone-txt:active{color:var(--dark);border-bottom-color:var(--dark)}
  .msg-txt{font-size:12.5px;line-height:1.75;color:var(--ink-soft)}

  /* ===== 状态 ===== */
  .state{
    text-align:center;padding:44px 10px;
    font-size:13px;color:var(--ink-soft);
  }
  .state .heart{
    width:34px;height:34px;margin:0 auto 12px;
    color:var(--gold-light);
  }
  .state.err{color:#B3452F}
  .spin{
    width:22px;height:22px;margin:0 auto 14px;
    border:1px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hide{display:none}

  /* ===== 底栏 ===== */
  .rec-foot{
    margin-top:26px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
  }
  .btn{
    padding:11px 22px;border:1px solid var(--gold);background:transparent;
    color:var(--gold);font-size:11px;letter-spacing:.25em;
    font-family:var(--sans);cursor:pointer;
  }
  .btn:active{background:var(--gold);color:var(--bg)}
  .foot-names{
    font-family:var(--serif);font-size:12px;
    color:var(--ink-soft);letter-spacing:.1em;
  }

  @media (max-width:420px){
    .page{padding:0 14px 48px}
    tbody td{padding:12px 7px}
    thead th{padding:11px 7px}
    .col-idx{width:26px}
    .col-name{width:26%}
    .col-phone{width:32%}
    .phone-txt{font-size:11px}
    .msg-txt{font-size:12px}
  }
</style>
</head>
<body>
<div class="page">

  <div class="rec-head">
    <div class="rec-label">GUEST BOOK</div>
    <h1 class="rec-title">祝福记录</h1>
    <div class="rec-sub">朱正军 &amp; 吴凤 · 2027.01.31</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </div>

  <div class="stats" id="stats">
    <div class="stat">
      <span class="stat-num" id="stat-total">—</span>
      <span class="stat-label">总祝福</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-today">—</span>
      <span class="stat-label">今日新增</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="stat-last">—</span>
      <span class="stat-label">最近提交</span>
    </div>
  </div>

  <div class="table-wrap">
    <div class="state" id="state-loading"><div class="spin"></div>正在读取祝福…</div>
    <div class="state err hide" id="state-error">
      <div class="heart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6.5 5.5 5.5 0 0 1 21.5 12c-2.5 4.5-9.5 9-9.5 9z"/>
        </svg>
      </div>
      <span id="err-msg">读取失败，请稍后重试</span>
    </div>
    <div class="state hide" id="state-empty">
      <div class="heart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6.5 5.5 5.5 0 0 1 21.5 12c-2.5 4.5-9.5 9-9.5 9z"/>
        </svg>
      </div>
      还没有收到祝福
    </div>
    <table id="tbl" class="hide">
      <thead>
        <tr>
          <th class="col-idx">#</th>
          <th class="col-name">称呼</th>
          <th class="col-phone">手机号</th>
          <th>祝福语</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="rec-foot">
    <button class="btn" id="refresh" type="button">刷 新</button>
    <div class="foot-names">WE ARE GETTING MARRIED</div>
  </div>

</div>

<script>
  const API = 'https://ashamed-ant-d7gztvbxw662e17cb-1258206454.ap-shanghai.app.tcloudbase.com/blessing?action=list&key=zjjwf-20270131-7d2c9e41';

  const $ = id => document.getElementById(id);
  const show = el => el.classList.remove('hide');
  const hide = el => el.classList.add('hide');

  function fmtTime(t){
    if(!t) return '';
    const d = new Date(t);
    if(isNaN(d.getTime())) return String(t);
    const pad = n => (n < 10 ? '0' + n : '' + n);
    return (d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function isToday(t){
    const d = new Date(t);
    if(isNaN(d.getTime())) return false;
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function render(rows){
    hide($('state-loading'));
    hide($('state-error'));

    $('stat-total').textContent = rows.length;
    $('stat-today').textContent = rows.filter(r => isToday(r.created_at)).length;
    $('stat-last').textContent = rows.length ? fmtTime(rows[0].created_at) : '—';

    if(!rows.length){
      hide($('tbl'));
      show($('state-empty'));
      return;
    }

    const tbody = $('tbody');
    tbody.innerHTML = '';
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');

      const tdIdx = document.createElement('td');
      tdIdx.className = 'col-idx';
      tdIdx.textContent = i + 1;

      const tdName = document.createElement('td');
      const nameSpan = document.createElement('span');
      nameSpan.className = 'name-txt';
      nameSpan.textContent = r.name || '匿名';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time-txt';
      timeSpan.textContent = fmtTime(r.created_at);
      tdName.appendChild(nameSpan);
      tdName.appendChild(timeSpan);

      const tdPhone = document.createElement('td');
      const phone = String(r.phone || '').replace(/\D/g, '');
      if(phone){
        const phoneLink = document.createElement('a');
        phoneLink.className = 'phone-txt';
        phoneLink.href = 'tel:' + phone;
        phoneLink.textContent = phone;
        tdPhone.appendChild(phoneLink);
      }else{
        const phoneSpan = document.createElement('span');
        phoneSpan.className = 'phone-txt';
        phoneSpan.textContent = '—';
        tdPhone.appendChild(phoneSpan);
      }

      const tdMsg = document.createElement('td');
      const msgSpan = document.createElement('span');
      msgSpan.className = 'msg-txt';
      msgSpan.textContent = r.message || '—';
      tdMsg.appendChild(msgSpan);

      tr.appendChild(tdIdx);
      tr.appendChild(tdName);
      tr.appendChild(tdPhone);
      tr.appendChild(tdMsg);
      tbody.appendChild(tr);
    });

    show($('tbl'));
    hide($('state-empty'));
  }

  function fail(msg){
    hide($('state-loading'));
    hide($('tbl'));
    hide($('state-empty'));
    $('err-msg').textContent = msg || '读取失败，请稍后重试';
    show($('state-error'));
  }

  function load(){
    hide($('state-error'));
    hide($('tbl'));
    hide($('state-empty'));
    show($('state-loading'));

    fetch(API, { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        if(!d.ok) throw new Error(d.error === 'forbidden' ? '访问口令不正确' : '读取失败');
        render(d.rows || []);
      })
      .catch(e => fail(e.message));
  }

  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
